<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Utama</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menu">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0b0d1f}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:#f4f6ff;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1100px 760px at 15% -10%,#1b1f4d 0,transparent 60%),radial-gradient(900px 700px at 100% 110%,#3a1550 0,transparent 55%),var(--bg)}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;animation:float 18s ease-in-out infinite}
.b1{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:#2f6bff}
.b2{width:36vmax;height:36vmax;right:-12vmax;top:18vh;background:#ff3d9a;animation-delay:-6s}
.b3{width:40vmax;height:40vmax;left:18vw;bottom:-20vmax;background:#10d9a8;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6vmax,4vmax) scale(1.12)}66%{transform:translate(-4vmax,7vmax) scale(.94)}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.8}}
header{max-width:980px;margin:0 auto;padding:44px 22px 26px}
.hi{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#aab4ff;opacity:0;animation:up .8s .05s forwards}
h1{font-size:clamp(34px,8vw,56px);line-height:1.05;margin:8px 0 10px;font-weight:800;background:linear-gradient(90deg,#fff,#9fb4ff,#ff9ad5,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .8s .15s both,shine 8s linear infinite}
@keyframes shine{to{background-position:250% 0}}
.dt{color:#b6bddf;opacity:0;animation:up .8s .3s forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;max-width:980px;margin:0 auto;padding:0 18px 28px}
.card{position:relative;display:flex;gap:16px;align-items:center;padding:20px;border-radius:24px;text-decoration:none;color:#fff;overflow:hidden;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;transform:translateY(26px) scale(.96);animation:in .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.1s + .35s);
  transition:transform .25s,box-shadow .25s,border-color .25s;-webkit-tap-highlight-color:transparent}
@keyframes in{to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.22;transition:opacity .3s}
.card::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);transition:left .8s}
.card:hover,.card:focus-visible{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 44px -14px var(--c1);border-color:rgba(255,255,255,.42);outline:none}
.card:hover::before,.card:focus-visible::before{opacity:.46}
.card:hover::after,.card:focus-visible::after{left:130%}
.card:active{transform:scale(.97)}
.ic{position:relative;z-index:1;flex:none;width:60px;height:60px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 22px -8px var(--c1);animation:bob 4.5s ease-in-out infinite;animation-delay:calc(var(--i)*-.9s)}
@keyframes bob{50%{transform:translateY(-4px) rotate(-4deg)}}
.ic svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{position:relative;z-index:1;min-width:0}
.tx b{display:block;font-size:18px}
.tx span{display:block;font-size:13px;color:#d4d9f5;opacity:.85;margin-top:2px}
.go{position:relative;z-index:1;margin-left:auto;width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.65;transition:transform .25s,opacity .25s}
.card:hover .go,.card:focus-visible .go{transform:translateX(5px);opacity:1}
.exit{display:flex;justify-content:center;padding:0 18px 10px}
.exit button{font:inherit;font-weight:600;min-height:48px;padding:0 26px;display:inline-flex;align-items:center;gap:10px;border-radius:999px;color:#fff;cursor:pointer;background:rgba(255,77,109,.14);border:1px solid rgba(255,120,140,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .25s,box-shadow .25s,background .25s;-webkit-tap-highlight-color:transparent}
.exit button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.exit button:hover,.exit button:focus-visible{background:rgba(255,77,109,.28);box-shadow:0 12px 28px -12px #ff4d6d;outline:none}
.exit button:active{transform:scale(.96)}
dialog{margin:auto;border:1px solid rgba(255,255,255,.2);border-radius:22px;background:#151a3a;color:#f4f6ff;width:min(88vw,380px);padding:22px;text-align:center}
dialog::backdrop{background:rgba(5,6,18,.7)}
dialog p{margin:0 0 16px;color:#d4d9f5}
dialog button{font:inherit;font-weight:600;min-height:44px;padding:0 24px;border:0;border-radius:999px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#2f6bff,#b36bff)}
footer{text-align:center;color:#8a93c4;font-size:12px;padding:6px 18px 30px}
footer a{color:#aab4ff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card,.hi,.dt,h1{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<header>
  <div class="hi" id="hi">Selamat datang</div>
  <h1>Menu Utama</h1>
  <div class="dt" id="dt"></div>
</header>
<main class="grid" id="grid"></main>
<div class="exit"><button type="button" id="keluar"><svg viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M16 8l4 4-4 4M20 12H9"/></svg>Keluar</button></div>
<dialog id="dlg"><p id="dlgt"></p><button type="button" id="dlgx">Mengerti</button></dialog>
<footer>Menu: <span id="ver"></span> &middot; <a href="#" id="upd">Perbarui</a></footer>
<script>
// ===== DAFTAR APLIKASI: ubah / tambah di sini saja =====
// nama = judul kartu, ket = keterangan singkat, ikon = order | kubus | kotak | banding, c = dua warna kartu
const APLIKASI=[
  {nama:'Cek Order',   ket:'Pelacak order',               url:'https://sampurnaku.github.io/order/',    ikon:'order',  c:['#ff9a3d','#ff4d6d']},
  {nama:'Kubikasi',    ket:'Buku kirim & kubikasi',       url:'https://sampurnaku.github.io/kubikasi/', ikon:'kubus',  c:['#12d8fa','#1f7bff']},
  {nama:'GWNW',        ket:'Buka aplikasi GWNW',          url:'https://sampurnaku.github.io/gwnw/',     ikon:'kotak',  c:['#b36bff','#6366f1']},
  {nama:'Cek PZZL vs SAP', ket:'Bandingkan PZZL dengan SAP', url:'https://sampurnaku.github.io/datasap/', ikon:'banding',c:['#34d399','#059669']}
];
const VERSI_MENU='16 Nov 2026';
// =======================================================
const IKON={
  order:'<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4h6v3H9z"/><path d="M8.5 13.5l2.5 2.5 4.5-5.5"/>',
  kubus:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
  kotak:'<rect x="4" y="4" width="7" height="7" rx="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.8"/>',
  banding:'<path d="M5 8h13l-3.5-3.5M19 16H6l3.5 3.5"/>'
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
$('#grid').innerHTML=APLIKASI.map((a,i)=>`<a class="card" href="${esc(a.url)}" style="--i:${i};--c1:${a.c[0]};--c2:${a.c[1]}">
  <div class="ic"><svg viewBox="0 0 24 24">${IKON[a.ikon]||IKON.kotak}</svg></div>
  <div class="tx"><b>${esc(a.nama)}</b><span>${esc(a.ket)}</span></div>
  <svg class="go" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></a>`).join('');
const h=new Date().getHours();
$('#hi').textContent='Selamat '+(h<4?'malam':h<11?'pagi':h<15?'siang':h<18?'sore':'malam');
$('#dt').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
$('#ver').textContent=VERSI_MENU;
// bintang berkelip
for(let i=0;i<26;i++){const s=document.createElement('i');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*4).toFixed(2)}s;animation-duration:${(3+Math.random()*3).toFixed(2)}s`;document.querySelector('.bg').appendChild(s)}
// tombol Keluar: browser hanya mengizinkan penutupan di aplikasi terpasang; selain itu tampilkan petunjuk
$('#dlgx').onclick=()=>$('#dlg').close();
$('#keluar').onclick=()=>{
  try{window.close()}catch(x){}
  setTimeout(()=>{if(document.visibilityState==='hidden')return;
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    $('#dlgt').textContent=ios?'Untuk keluar, geser layar dari bawah ke atas (atau tekan dua kali tombol Home), lalu geser aplikasi ini ke atas.':'Browser tidak mengizinkan aplikasi menutup dirinya. Untuk keluar, tekan tombol Home, atau buka daftar aplikasi lalu geser aplikasi ini untuk menutupnya.';
    $('#dlg').showModal()},400)};
// service worker (hanya milik menu ini)
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
// "Perbarui": hanya membuang simpanan menu ini, tidak menyentuh aplikasi lain
$('#upd').onclick=async e=>{e.preventDefault();
  try{for(const n of await caches.keys())if(n.startsWith('menu-'))await caches.delete(n);const r=await navigator.serviceWorker.getRegistration();if(r)await r.unregister()}catch(x){}
  location.reload()};
</script>
</body>
</html>
